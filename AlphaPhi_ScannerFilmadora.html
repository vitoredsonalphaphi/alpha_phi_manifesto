<title>Scanner Filmadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#070810; --text:#C8BBAA; --muted:#2E4055;
  --accent:#C8960A; --gold:#F5D55A; --aqua:#4AFFE8;
  --violet:#6B3AFF; --alpha:#E84040;
  --panel:rgba(7,8,16,0.92); --border:rgba(20,35,60,0.8);
}
body { background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,sans-serif;
       height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none; }
header { display:flex; align-items:center; justify-content:space-between;
         padding:8px 16px; border-bottom:1px solid var(--border); flex-shrink:0; gap:12px; }
.h-title { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; }
.h-meta  { font-family:'Space Mono',monospace; font-size:8.5px; color:var(--muted); display:flex; gap:18px; }
.h-meta span { color:var(--text); }
.h-meta .hl  { color:var(--gold); }
.canvas-wrap { flex:1; position:relative; overflow:hidden; min-height:0; }
canvas { display:block; }

/* Legend */
.legend { position:absolute; top:50%; right:14px; transform:translateY(-50%);
          background:var(--panel); border:1px solid var(--border); border-radius:6px;
          padding:11px 13px; font-family:'Space Mono',monospace; font-size:8px; width:148px; }
.lg-title { color:var(--muted); font-size:7.5px; letter-spacing:.12em; margin-bottom:9px; }
.lg-row   { display:flex; align-items:center; gap:7px; margin-bottom:6px; font-size:8px; line-height:1.3; }
.lg-swatch { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.lg-divider { border:none; border-top:1px solid var(--border); margin:8px 0; }
.lg-note  { color:var(--muted); font-size:7px; line-height:1.6; }

/* Mode tabs */
.mode-tabs { display:flex; gap:4px; }
.mode-btn  { font-family:'Space Mono',monospace; font-size:8px; letter-spacing:.04em;
             padding:3px 9px; border:1px solid var(--border); border-radius:3px;
             background:transparent; color:var(--muted); cursor:pointer; transition:.15s; }
.mode-btn:hover  { border-color:var(--accent); color:var(--text); }
.mode-btn.active { border-color:var(--aqua);   color:var(--aqua); background:rgba(74,255,232,.05); }

footer { display:flex; align-items:center; gap:10px; padding:8px 16px;
         border-top:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
.signal-group { display:flex; gap:5px; flex-wrap:wrap; }
.sig-btn { font-family:'Space Mono',monospace; font-size:8px; padding:4px 9px;
           border:1px solid var(--border); border-radius:3px; background:transparent;
           color:var(--muted); cursor:pointer; transition:.15s; white-space:nowrap; }
.sig-btn:hover  { border-color:var(--accent); color:var(--text); }
.sig-btn.active { border-color:var(--gold);   color:var(--gold); }
.btn-scan { font-family:'Space Mono',monospace; font-size:9px; padding:5px 14px;
            border:1px solid var(--aqua); border-radius:4px; background:rgba(74,255,232,.04);
            color:var(--aqua); cursor:pointer; margin-left:6px; transition:.15s; white-space:nowrap; }
.btn-scan:hover    { background:rgba(74,255,232,.1); }
.btn-scan:disabled { opacity:.4; pointer-events:none; }
.spacer { flex:1; }
.status-txt { font-family:'Space Mono',monospace; font-size:8.5px; color:var(--muted); white-space:nowrap; }
.status-txt em { font-style:normal; color:var(--text); }
</style>

<header>

<div class="canvas-wrap">
  <canvas id="c"></canvas>
  <div class="legend" id="leg">
    <div class="lg-title" id="legTitle">CÂMERA 1 · ESPECTRAL</div>
    <div class="lg-row"><div class="lg-swatch" style="background:linear-gradient(90deg,#0E1E48,#1E4A90)"></div>Entropia (Coh→α)</div>
    <div class="lg-row"><div class="lg-swatch" style="background:linear-gradient(90deg,#C8960A,#F5D55A)"></div>Coerência (Coh→φ)</div>
    <div class="lg-row"><div class="lg-swatch" style="background:#4AFFE8;opacity:.8"></div>Simetria harmônica</div>
    <div class="lg-row"><div class="lg-swatch" style="background:#6B3AFF"></div>Projeção fractal φ</div>
    <div class="lg-row"><div class="lg-swatch" style="background:#E84040;border-radius:50%"></div>α — âncora</div>
    <hr class="lg-divider">
    <div class="lg-note" id="legNote">Anéis = bandas φ<br>Ângulo = freq (log)<br>Brilho = Coh local</div>
  </div>
</div>

<footer>
  <div class="mode-tabs">
    <button class="mode-btn active" id="modeSpec" onclick="setMode('spec')">◎ Espectral</button>
    <button class="mode-btn" id="modeCep"  onclick="setMode('cep')">⊙ Cepstral</button>
  </div>
  <div class="signal-group">
    <button class="sig-btn" onclick="selectSignal('phi220')">Sinal φ 220Hz</button>
    <button class="sig-btn" onclick="selectSignal('harm440')">Harmônico 440Hz</button>
    <button class="sig-btn" onclick="selectSignal('pink')">Campo 1/f</button>
    <button class="sig-btn" onclick="selectSignal('ecobip')">EcoBIP 880Hz</button>
    <button class="sig-btn" onclick="selectSignal('noise')">Ruído</button>
  </div>
  <button class="btn-scan" id="scanBtn" onclick="startScan()">⊙ Escanear</button>
  <div class="spacer"></div>
  <span class="status-txt" id="statTxt">selecione um sinal e câmera</span>
</footer>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const PHI   = (1 + Math.sqrt(5)) / 2;
const ALPHA = 1 / 137.035999;
const N_BAND = 9;
const N_ANG  = 720;
const D_PHI  = Math.log(2) / Math.log(PHI);  // ≈ 1.440 — dimensão fractal φ-natural
const BAND_R = [0.13, 0.23, 0.33, 0.43, 0.52, 0.61, 0.70, 0.79, 0.89];

let mode = 'spec';  // 'spec' | 'cep'

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy, R, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement;
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  cx = W / 2; cy = H / 2;
  R  = Math.min(cx, cy) * 0.88;
}
window.addEventListener('resize', () => { resize(); if (currentSig) redraw(1); });

// ── Color ─────────────────────────────────────────────────────────────────────
function cohRGB(coh) {
  const t = Math.max(0, Math.min(1, (coh - ALPHA) / (1 - ALPHA)));
  const s = [[0,[14,24,72]],[.18,[22,48,110]],[.40,[30,80,155]],
             [.62,[168,112,16]],[.82,[240,200,70]],[1,[255,232,154]]];
  for (let i = 0; i < s.length - 1; i++) {
    const [t0,c0] = s[i], [t1,c1] = s[i+1];
    if (t <= t1) {
      const u = (t - t0) / (t1 - t0);
      return [c0[0]+u*(c1[0]-c0[0]), c0[1]+u*(c1[1]-c0[1]), c0[2]+u*(c1[2]-c0[2])];
    }
  }
  return [255,232,154];
}
function cohCSS(coh, a=1) {
  const [r,g,b] = cohRGB(coh);
  return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a})`;
}

// ── Signal definitions ────────────────────────────────────────────────────────
// cohBands[k] = avg Coh of spectral band k (used for both modes)
// cepBands[m] = cepstral energy of quefrency band m
// seeds_spec   = spectral seeds (for Camera 1)
// seeds_cep    = coupling matrix seeds (for Camera 2)
// D_est        = estimated fractal dimension

function mulberry32(seed) {
  let s = seed;
  return () => {
    s|=0; s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function gaussian(x, mu, sigma) { return Math.exp(-.5*((x-mu)/sigma)**2); }
function angDist(a,b) { const d=Math.abs(a-b)%N_ANG; return Math.min(d,N_ANG-d); }
function freqToAngle(hz) {
  return ((Math.log2(hz)-Math.log2(20))/(Math.log2(8000)-Math.log2(20))*N_ANG)%N_ANG;
}

function buildSig(fn) {
  const c=new Float32Array(N_BAND*N_ANG);
  for(let b=0;b<N_BAND;b++) for(let a=0;a<N_ANG;a++) c[b*N_ANG+a]=fn(b,a);
  return c;
}

function addHarmonics(coh, f0, nh, amp, spread) {
  for(let k=1;k<=nh;k++) {
    const hz=f0*k; if(hz>8000) break;
    const ang=freqToAngle(hz), a=amp/Math.sqrt(k);
    for(let b=0;b<N_BAND;b++) {
      const ba=a*(1-b*.06);
      for(let i=0;i<N_ANG;i++) {
        const gain=ba*gaussian(angDist(i,ang),0,spread);
        coh[b*N_ANG+i]=Math.min(1-ALPHA, coh[b*N_ANG+i]+gain);
      }
    }
  }
}

// Cepstral band profiles per signal (analytically derived)
// Index = cepstral band (N0=slow resonances/long period → N8=fast/short period)
// Higher value = more cepstral energy in that quefrency band
const CEP_PROFILES = {
  phi220:  [0.06, 0.07, 0.09, 0.12, 0.18, 0.38, 0.46, 0.28, 0.10],  // φ-peaks at 5,6,7
  harm440: [0.05, 0.05, 0.06, 0.18, 0.28, 0.14, 0.38, 0.12, 0.05],  // peaks at 3,4,6
  pink:    [0.50, 0.28, 0.14, 0.08, 0.05, 0.04, 0.03, 0.03, 0.02],  // dominated by low quefrency
  ecobip:  [0.05, 0.07, 0.09, 0.30, 0.42, 0.14, 0.10, 0.07, 0.05],  // peaks at 3,4
  noise:   [0.11, 0.11, 0.11, 0.11, 0.11, 0.11, 0.11, 0.11, 0.12],  // uniform
};

const SIGNALS = {
  phi220: {
    name:'Sinal φ · 220Hz', hurst:0.91, D_est:1.38,
    build() {
      const rng=mulberry32(220);
      const coh=buildSig((b,a)=>ALPHA+rng()*.014);
      addHarmonics(coh,220,4,.36,4.2);
      addHarmonics(coh,220*PHI,3,.26,5.0);
      addHarmonics(coh,220*PHI*PHI,2,.18,5.8);
      const a0=freqToAngle(220),a1=freqToAngle(220*PHI),a2=freqToAngle(220*PHI*PHI);
      return {coh,
        cohBands: bandAvg(coh),
        cepBands: CEP_PROFILES.phi220,
        seeds:[{b:2,a:Math.round(a0),prob:.85},{b:3,a:Math.round(a1),prob:.72},{b:4,a:Math.round(a2),prob:.58}],
        symmetries:[220,220*PHI,220*PHI**2].filter(h=>h<8000).map(h=>({ang:freqToAngle(h),strength:.6/Math.sqrt(h/220)}))
      };
    }
  },
  harm440: {
    name:'Harmônico 440Hz', hurst:0.74, D_est:1.52,
    build() {
      const rng=mulberry32(440);
      const coh=buildSig((b,a)=>ALPHA+rng()*.012);
      addHarmonics(coh,440,7,.42,3.8);
      const a0=freqToAngle(440);
      return {coh,
        cohBands:bandAvg(coh),
        cepBands:CEP_PROFILES.harm440,
        seeds:[{b:2,a:Math.round(a0),prob:.88},{b:4,a:Math.round(freqToAngle(880)),prob:.72},{b:5,a:Math.round(freqToAngle(1320)),prob:.55}],
        symmetries:[440,880,1320,1760,2200,2640].filter(h=>h<8000).map(h=>({ang:freqToAngle(h),strength:.55/Math.sqrt(h/440)}))
      };
    }
  },
  pink: {
    name:'Campo 1/f · H≈1.0', hurst:0.95, D_est:1.20,
    build() {
      const rng=mulberry32(99);
      const coh=buildSig((b,a)=>{
        const base=.28*Math.pow(PHI,-(b*.55));
        return Math.max(ALPHA,base+rng()*.025+.018*Math.sin(a/N_ANG*2*Math.PI*3+b));
      });
      return {coh,
        cohBands:bandAvg(coh),
        cepBands:CEP_PROFILES.pink,
        seeds:[1,2,3].map(b=>({b,a:Math.round(N_ANG*.27),prob:.65-b*.1})),
        symmetries:[]
      };
    }
  },
  ecobip: {
    name:'EcoBIP 880Hz', hurst:0.81, D_est:1.44,
    build() {
      const rng=mulberry32(880);
      const coh=buildSig((b,a)=>{
        const base=.12*Math.pow(PHI,-(b*.4));
        return Math.max(ALPHA,base+rng()*.014);
      });
      addHarmonics(coh,880,5,.50,5.5);
      addHarmonics(coh,440,2,.22,7.0);
      return {coh,
        cohBands:bandAvg(coh),
        cepBands:CEP_PROFILES.ecobip,
        seeds:[{b:3,a:Math.round(freqToAngle(880)),prob:.91},{b:5,a:Math.round(freqToAngle(1760)),prob:.75},{b:6,a:Math.round(freqToAngle(2640)),prob:.58}],
        symmetries:[880,1760,2640,3520].filter(h=>h<8000).map(h=>({ang:freqToAngle(h),strength:.62/Math.sqrt(h/880)}))
      };
    }
  },
  noise: {
    name:'Ruído Branco', hurst:0.50, D_est:2.00,
    build() {
      const rng=mulberry32(137);
      const coh=buildSig((b,a)=>ALPHA+rng()*.018+rng()*.008);
      return {coh, cohBands:bandAvg(coh), cepBands:CEP_PROFILES.noise, seeds:[], symmetries:[]};
    }
  }
};

function bandAvg(coh) {
  const out=new Array(N_BAND);
  for(let b=0;b<N_BAND;b++) {
    let s=0; for(let a=0;a<N_ANG;a++) s+=coh[b*N_ANG+a];
    out[b]=s/N_ANG;
  }
  return out;
}

// ── Coupling matrix T_φ(k,m) ─────────────────────────────────────────────────
function buildT9x9(cohBands, cepBands) {
  // Normalize cepBands so sum=1
  const cepSum = cepBands.reduce((s,v)=>s+v,0)+1e-12;
  const cepN   = cepBands.map(v=>v/cepSum);
  const cohSum = cohBands.reduce((s,v)=>s+v,0)+1e-12;
  const cohN   = cohBands.map(v=>v/cohSum);

  // T[k][m] = cohN[k] × cepN[m]
  const T = Array.from({length:N_BAND},(_,k)=>cohN[k]);
  const mat = [];
  for(let k=0;k<N_BAND;k++) {
    mat.push(new Float32Array(N_BAND));
    for(let m=0;m<N_BAND;m++) mat[k][m]=cohN[k]*cepN[m];
  }

  // Scale to Coh range
  const tmax = Math.max(...mat.flat().map(r=>Math.max(...r)));
  const scale = (1-ALPHA*2)/(tmax+1e-12);
  const coh9 = mat.map(row=>row.map(v=>Math.min(1-ALPHA,ALPHA+v*scale*4)));

  // Seeds: cells above threshold
  const flat = coh9.flat();
  const mean = flat.reduce((s,v)=>s+v,0)/flat.length;
  const std  = Math.sqrt(flat.reduce((s,v)=>s+(v-mean)**2,0)/flat.length);
  const threshold = mean + std;
  const seeds9=[];
  for(let k=0;k<N_BAND;k++)
    for(let m=0;m<N_BAND;m++)
      if(coh9[k][m]>threshold)
        seeds9.push({k,m,prob:(coh9[k][m]-threshold)/(coh9.flat().reduce((a,b)=>Math.max(a,b))-threshold+1e-8)});
  seeds9.sort((a,b)=>b.prob-a.prob);

  // Diagonal vector (expansion potential)
  const diag=coh9.map((row,k)=>row[k]);
  const vecExp=diag.slice(1).map((v,i)=>v-diag[i]);

  // Fractal dimension estimate: log-log fit of diagonal
  const ks=Array.from({length:N_BAND},(_,i)=>Math.log(i+1));
  const ds=diag.map(v=>Math.log(Math.max(v,1e-12)));
  const n=N_BAND, sx=ks.reduce((a,b)=>a+b,0), sy=ds.reduce((a,b)=>a+b,0);
  const sxy=ks.reduce((s,x,i)=>s+x*ds[i],0), sx2=ks.reduce((s,x)=>s+x*x,0);
  const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx+1e-12);
  const D=Math.max(.5,Math.min(3,-slope));

  return {mat:coh9, seeds9, vecExp, D};
}

// ── Draw: Camera 1 — Espectral (radial) ──────────────────────────────────────
function drawBase() {
  ctx.save(); ctx.scale(dpr,dpr);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  bg.addColorStop(0,'#0D1530'); bg.addColorStop(.6,'#070810'); bg.addColorStop(1,'#040509');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  for(let i=5;i>=0;i--) {
    ctx.beginPath(); ctx.arc(cx,cy,R*.90+i*2,0,Math.PI*2);
    ctx.strokeStyle=`rgba(245,213,90,${.018+i*.005})`; ctx.lineWidth=.8+i*.2; ctx.stroke();
  }
  ctx.font='7.5px Space Mono,monospace'; ctx.fillStyle='rgba(245,213,90,.18)'; ctx.textAlign='center';
  ctx.fillText('Campo Harmônico · r=1',cx,cy-R*.90-8);
  ctx.restore();
}

function drawSpec(data, progress) {
  if(!data) return;
  const {coh,seeds,symmetries}=data;
  ctx.save(); ctx.scale(dpr,dpr);

  // Pixel fill
  const imgData=ctx.createImageData(Math.round(W*dpr),Math.round(H*dpr));
  const px=imgData.data, W2=Math.round(W*dpr), H2=Math.round(H*dpr);
  const cx2=cx*dpr, cy2=cy*dpr, R2=R*dpr;
  const revBands=Math.ceil(progress*N_BAND);

  for(let y=0;y<H2;y++) for(let x=0;x<W2;x++) {
    const dx=x-cx2,dy=y-cy2, dist=Math.sqrt(dx*dx+dy*dy)/R2;
    if(dist<.05||dist>.92) continue;
    let band=-1;
    for(let b=0;b<N_BAND;b++) {
      const lo=b===0?.05:BAND_R[b-1];
      if(dist>=lo&&dist<BAND_R[b]){band=b;break;}
    }
    if(band<0||band>=revBands) continue;
    let ang=((Math.atan2(dy,dx)*180/Math.PI)+360)%360;
    const angIdx=Math.floor(ang/360*N_ANG);
    const cohVal=coh[band*N_ANG+Math.min(angIdx,N_ANG-1)];
    const lo=band===0?.05:BAND_R[band-1], hi=BAND_R[band];
    const t=(dist-lo)/(hi-lo), fade=.72+.28*Math.sin(t*Math.PI);
    const [r,g,b2]=cohRGB(cohVal);
    const idx=(y*W2+x)*4;
    px[idx]=Math.round(r*fade); px[idx+1]=Math.round(g*fade);
    px[idx+2]=Math.round(b2*fade); px[idx+3]=Math.round(200*fade);
  }
  ctx.restore(); ctx.putImageData(imgData,0,0); ctx.save(); ctx.scale(dpr,dpr);

  // Symmetry rays
  if(progress>.4) {
    const sa=Math.min(1,(progress-.4)/.3);
    symmetries.forEach(({ang,strength})=>{
      const rad=ang/N_ANG*2*Math.PI-Math.PI/2;
      const grad=ctx.createLinearGradient(cx+.05*R*Math.cos(rad),cy+.05*R*Math.sin(rad),
                                          cx+.88*R*Math.cos(rad),cy+.88*R*Math.sin(rad));
      grad.addColorStop(0,'rgba(74,255,232,0)');
      grad.addColorStop(.35,`rgba(74,255,232,${strength*.35*sa})`);
      grad.addColorStop(.75,`rgba(74,255,232,${strength*.2*sa})`);
      grad.addColorStop(1,'rgba(74,255,232,0)');
      ctx.beginPath(); ctx.moveTo(cx+.05*R*Math.cos(rad),cy+.05*R*Math.sin(rad));
      ctx.lineTo(cx+.88*R*Math.cos(rad),cy+.88*R*Math.sin(rad));
      ctx.strokeStyle=grad; ctx.lineWidth=1+strength*1.8; ctx.stroke();
    });
  }

  // Seeds + φ-spirals
  if(progress>.65) {
    const sa=Math.min(1,(progress-.65)/.25);
    seeds.forEach(({b,a,prob})=>{
      if(b>=revBands) return;
      const ang_rad=(a/N_ANG*2*Math.PI)-Math.PI/2;
      const r_mid=((b===0?.05:BAND_R[b-1])+BAND_R[b])/2*R;
      const sx=cx+r_mid*Math.cos(ang_rad), sy=cy+r_mid*Math.sin(ang_rad);
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,18*prob);
      g.addColorStop(0,`rgba(107,58,255,${.5*prob*sa})`);
      g.addColorStop(.5,`rgba(107,58,255,${.2*prob*sa})`);
      g.addColorStop(1,'rgba(107,58,255,0)');
      ctx.beginPath(); ctx.arc(sx,sy,18*prob,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      ctx.save(); ctx.globalAlpha=prob*.5*sa;
      ctx.beginPath();
      for(let i=0;i<=200;i++) {
        const t=i/200, pr=12+t*55*prob, pa=ang_rad+t*Math.PI*2.5*(1/PHI);
        i===0?ctx.moveTo(sx+pr*Math.cos(pa),sy+pr*Math.sin(pa))
             :ctx.lineTo(sx+pr*Math.cos(pa),sy+pr*Math.sin(pa));
      }
      ctx.strokeStyle='rgba(107,58,255,.7)'; ctx.lineWidth=.7; ctx.stroke();
      ctx.globalAlpha=sa;
      ctx.shadowBlur=10; ctx.shadowColor='#6B3AFF';
      ctx.beginPath(); ctx.arc(sx,sy,2.5+prob*2,0,Math.PI*2);
      ctx.fillStyle=`rgba(180,140,255,.85)`; ctx.fill(); ctx.shadowBlur=0;
      ctx.restore();
    });
  }

  drawAlpha();
  ctx.restore();
}

// ── Draw: Camera 2 — Cepstral (coupling matrix 9×9) ──────────────────────────
function drawCepstral(data, t9, progress) {
  if(!data||!t9) return;
  ctx.save(); ctx.scale(dpr,dpr);

  const {mat, seeds9, vecExp, D} = t9;

  // Matrix grid dimensions
  const margin = 60, labelW=28;
  const gridW = Math.min(W - margin*2 - labelW*2, H - margin*2 - labelW*2);
  const gx = (W - gridW)/2 + labelW;
  const gy = (H - gridW)/2 + labelW;
  const cell = gridW / N_BAND;
  const revCells = Math.ceil(progress * N_BAND * N_BAND);

  // Background
  ctx.fillStyle='rgba(13,21,37,0.7)';
  ctx.roundRect(gx-30, gy-30, gridW+60, gridW+60, 8);
  ctx.fill();

  // Axis labels
  ctx.font='7px Space Mono,monospace'; ctx.fillStyle='rgba(46,64,85,0.8)'; ctx.textAlign='center';
  for(let i=0;i<N_BAND;i++) {
    ctx.fillText(`N${i}`, gx+cell*(i+.5), gy-14);
    ctx.save(); ctx.translate(gx-16, gy+cell*(i+.5));
    ctx.rotate(-Math.PI/2); ctx.fillText(`N${i}`, 0, 0); ctx.restore();
  }
  ctx.fillStyle='rgba(46,64,85,0.55)'; ctx.font='8px Space Mono,monospace';
  ctx.fillText('Quefrência τ (eco interior)', gx+gridW/2, gy-26);
  ctx.save(); ctx.translate(gx-36, gy+gridW/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Frequência ω (superfície)', 0, 0); ctx.restore();

  // Cells
  let cellIdx=0;
  for(let k=0;k<N_BAND;k++) for(let m=0;m<N_BAND;m++) {
    if(cellIdx++ >= revCells) { continue; }
    const coh=mat[k][m];
    const [r,g,b]=cohRGB(coh);
    ctx.fillStyle=`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.85)`;
    ctx.fillRect(gx+m*cell+.5, gy+k*cell+.5, cell-.5, cell-.5);
  }

  // Cell borders (faint grid)
  ctx.strokeStyle='rgba(20,35,60,0.6)'; ctx.lineWidth=.4;
  for(let i=0;i<=N_BAND;i++) {
    ctx.beginPath(); ctx.moveTo(gx+i*cell,gy); ctx.lineTo(gx+i*cell,gy+gridW); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx,gy+i*cell); ctx.lineTo(gx+gridW,gy+i*cell); ctx.stroke();
  }

  if(progress>.5) {
    const pa=Math.min(1,(progress-.5)/.35);

    // Diagonal (auto-similarity reference)
    ctx.beginPath();
    for(let i=0;i<N_BAND;i++) {
      const x=gx+i*cell, y=gy+i*cell;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.lineTo(gx+N_BAND*cell, gy+N_BAND*cell);
    ctx.strokeStyle=`rgba(74,255,232,${.25*pa})`; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.stroke(); ctx.setLineDash([]);

    // Seeds
    seeds9.slice(0,8).forEach(({k,m,prob})=>{
      const sx=gx+m*cell+cell/2, sy=gy+k*cell+cell/2;
      const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,cell*.7*prob);
      gr.addColorStop(0,`rgba(107,58,255,${.55*prob*pa})`);
      gr.addColorStop(1,'rgba(107,58,255,0)');
      ctx.beginPath(); ctx.arc(sx,sy,cell*.7*prob,0,Math.PI*2); ctx.fillStyle=gr; ctx.fill();
      if(prob>.4) {
        ctx.shadowBlur=8; ctx.shadowColor='#6B3AFF';
        ctx.beginPath(); ctx.arc(sx,sy,3+prob*3,0,Math.PI*2);
        ctx.fillStyle=`rgba(180,140,255,${.85*pa})`; ctx.fill(); ctx.shadowBlur=0;
      }
    });

    // D_phi annotation
    const dColor = Math.abs(D-D_PHI)<.15?'#4AFFE8':'#E84040';
    ctx.font='8px Space Mono,monospace'; ctx.fillStyle=`rgba(${dColor==='#4AFFE8'?'74,255,232':'232,64,64'},${.7*pa})`;
    ctx.textAlign='left';
    ctx.fillText(`D_med=${D.toFixed(3)}  D_φ=${D_PHI.toFixed(3)}`, gx, gy+gridW+20);
    ctx.fillText(Math.abs(D-D_PHI)<.15?'✓ atrator φ':'○ fora do atrator', gx, gy+gridW+32);

    // Expansion bar strip below matrix
    const barH=6, barY=gy+gridW+45;
    vecExp.forEach((dv,i)=>{
      const bx=gx+i*cell+1, bw=cell-2;
      const pct=Math.min(1,Math.abs(dv)/.05);
      ctx.fillStyle=dv>0?`rgba(74,255,232,${.55*pct*pa})`:`rgba(232,64,64,${.55*pct*pa})`;
      ctx.fillRect(bx, barY, bw, barH);
    });
    ctx.font='7px Space Mono,monospace'; ctx.fillStyle=`rgba(46,64,85,${.6*pa})`;
    ctx.textAlign='left'; ctx.fillText('ΔT expansão →', gx, barY-3);
  }

  // Outer frame
  ctx.strokeStyle='rgba(46,64,85,0.5)'; ctx.lineWidth=.7;
  ctx.strokeRect(gx, gy, gridW, gridW);

  drawAlpha();
  ctx.restore();
}

function drawAlpha() {
  const t=Date.now()/1000, f=.72+.28*Math.sin(t*6.3)*Math.sin(t*2.7+.8);
  ctx.shadowBlur=16; ctx.shadowColor='#E84040';
  ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2);
  ctx.fillStyle=`rgba(232,64,64,${.9*f})`; ctx.fill(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2);
  ctx.fillStyle=`rgba(232,64,64,${.07*f})`; ctx.fill();
  ctx.font='8px Space Mono,monospace';
  ctx.fillStyle=`rgba(232,64,64,${.4*f})`; ctx.textAlign='center';
  ctx.fillText('α',cx,cy+17);
}

// ── State & Animation ─────────────────────────────────────────────────────────
let currentSig=null, currentData=null, currentT9=null;
let scanProgress=0, scanAnimId=null, idleId=null;

function redraw(progress) {
  if(!currentData) return;
  drawBase();
  if(mode==='spec') drawSpec(currentData, progress);
  else              drawCepstral(currentData, currentT9, progress);
}

function startScan() {
  if(!currentSig) return;
  if(idleId)     { cancelAnimationFrame(idleId); idleId=null; }
  if(scanAnimId) cancelAnimationFrame(scanAnimId);
  const sig=SIGNALS[currentSig];
  currentData=sig.build();
  currentT9=buildT9x9(currentData.cohBands, currentData.cepBands);
  scanProgress=0;

  // Update header
  const cohMean=currentData.cohBands.reduce((s,v)=>s+v,0)/N_BAND;
  document.getElementById('hSig').textContent=sig.name;
  document.getElementById('hHurst').textContent=sig.hurst.toFixed(2);
  document.getElementById('hCoh').textContent=cohMean.toFixed(4);
  document.getElementById('hDim').textContent=currentT9.D.toFixed(3);
  document.getElementById('hSeeds').textContent=
    mode==='spec'?currentData.seeds.length:currentT9.seeds9.length;
  document.getElementById('scanBtn').disabled=true;
  document.getElementById('statTxt').innerHTML='<em>escaneando...</em>';

  const start=performance.now(), DUR=mode==='spec'?1800:1400;
  function step(ts) {
    const t=Math.min(1,(ts-start)/DUR);
    scanProgress=easeIO(t);
    drawBase();
    if(mode==='spec') drawSpec(currentData, scanProgress);
    else              drawCepstral(currentData, currentT9, scanProgress);
    if(t<1) { scanAnimId=requestAnimationFrame(step); return; }
    scanProgress=1;
    document.getElementById('scanBtn').disabled=false;
    document.getElementById('statTxt').innerHTML=
      mode==='spec'?`scan espectral · ${currentData.seeds.length} sementes φ`
                   :`scan cepstral · D=${currentT9.D.toFixed(3)} · ${currentT9.seeds9.length} sementes`;
    idleLoop();
  }
  requestAnimationFrame(step);
}

function idleLoop() {
  if(!currentData||scanProgress<1) return;
  drawBase();
  if(mode==='spec') drawSpec(currentData, 1);
  else              drawCepstral(currentData, currentT9, 1);
  idleId=requestAnimationFrame(idleLoop);
}

function easeIO(t) { return t<.5?2*t*t:-1+(4-2*t)*t; }

function selectSignal(key) {
  currentSig=key;
  document.querySelectorAll('.sig-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('statTxt').innerHTML=`sinal: <em>${SIGNALS[key].name}</em>`;
  if(idleId){cancelAnimationFrame(idleId);idleId=null;}
  currentData=SIGNALS[key].build();
  currentT9=buildT9x9(currentData.cohBands,currentData.cepBands);
  resize(); drawBase();
  if(mode==='spec') drawSpec(currentData, .07);
  else              drawCepstral(currentData, currentT9, .07);
}

function setMode(m) {
  mode=m;
  document.getElementById('modeSpec').classList.toggle('active',m==='spec');
  document.getElementById('modeCep').classList.toggle('active',m==='cep');
  const leg=document.getElementById('legTitle'), note=document.getElementById('legNote');
  if(m==='spec') {
    leg.textContent='CÂMERA 1 · ESPECTRAL';
    note.innerHTML='Anéis = bandas φ<br>Ângulo = freq (log)<br>Brilho = Coh local';
  } else {
    leg.textContent='CÂMERA 2 · CEPSTRAL';
    note.innerHTML='Eixo Y = freq. espectral<br>Eixo X = quefrência<br>Cor = T(ω,τ) = S⊗C<br>• violeta = sementes φ<br>--- = auto-similaridade';
  }
  if(currentData&&scanProgress>=1) { if(idleId){cancelAnimationFrame(idleId);idleId=null;} idleLoop(); }
  else if(currentData) { drawBase(); if(m==='spec') drawSpec(currentData,.07); else drawCepstral(currentData,currentT9,.07); }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
resize(); drawBase();
</script>
