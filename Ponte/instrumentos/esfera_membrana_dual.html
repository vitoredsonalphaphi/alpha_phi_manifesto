<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esfera da Membrana Dual</title>
<style>
/* Esfera em tela cheia; do centro para fora: α, seis membranas intermediárias, a membrana dual (azul e vermelha, que alternam de posição) e o campo harmônico dourado na superfície. */
:root{ --bg:#0a0d16; --panel:rgba(16,20,33,.95); --line:#262c40; --fg:#e7e9f2; --muted:#9aa1b8; --gold:#e8c36a; --red:#e0424f; --blue:#4f8cff; color-scheme:dark; }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;overflow:hidden}
#cena{position:fixed;inset:0;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--bg) 72%,transparent);pointer-events:none}
header>*{pointer-events:auto}
h1{font:600 14px Georgia,serif;letter-spacing:.08em;margin:0 0 2px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin:0 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(16,20,33,.88);color:var(--fg);border-radius:999px;padding:5px 11px;font:500 12px system-ui,sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip.neg[aria-pressed="true"]{border-color:var(--red);color:#ff9aa2}
.chip.pos[aria-pressed="true"]{border-color:var(--blue);color:#a9c8ff}
.chip:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#estado{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#estado .inner{max-width:680px;margin:0 auto;font-size:13px;color:#cfd3e2}
#estado b{color:var(--fg)}
</style>
</head>
<body>
<div id="cena" aria-label="Esfera da membrana dual: membranas de 33.059 pontos; gire com um dedo, aproxime com dois"></div>
<header>
  <h1>ESFERA DA MEMBRANA DUAL</h1>
  <p class="sub">33.059 pontos por membrana</p>
  <div class="chips" id="chipsRes" role="group" aria-label="Resultado da classificação">
    <button class="chip pos" type="button" id="bPos" aria-pressed="true"><span class="dot" style="background:var(--blue)"></span>Resultado positivo</button>
    <button class="chip neg" type="button" id="bNeg" aria-pressed="false"><span class="dot" style="background:var(--red)"></span>Resultado negativo</button>
    <button class="chip" type="button" id="bAuto" aria-pressed="false">Alternar sozinha</button>
  </div>
  <div class="chips" id="chipsVis" role="group" aria-label="Membranas visíveis">
    <button class="chip" type="button" id="vOuro" aria-pressed="true"><span class="dot" style="background:var(--gold)"></span>Campo harmônico</button>
    <button class="chip" type="button" id="vMemb" aria-pressed="true">Membrana dual</button>
    <button class="chip" type="button" id="vInter" aria-pressed="true">Membranas intermediárias</button>
    <button class="chip" type="button" id="vCentro" aria-pressed="true">α (centro)</button>
    <button class="chip" type="button" id="vCorte" aria-pressed="true">Corte</button>
  </div>
</header>
<aside id="estado"><div class="inner" id="estadoTxt"></div></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const NP=33059, PHI=(1+Math.sqrt(5))/2;
const G=new Float32Array(NP*3);
for(let i=0;i<NP;i++){const y=1-(2*i+1)/NP,r=Math.sqrt(1-y*y),t=2*Math.PI*i/PHI;G[3*i]=r*Math.cos(t);G[3*i+1]=y;G[3*i+2]=r*Math.sin(t)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(G,3));
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
const box=document.getElementById('cena');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x0a0d16);box.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1,.05,100);camera.position.set(3.2,.9,.7);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1.4;controls.maxDistance=9;controls.autoRotate=false;controls.autoRotateSpeed=.5;renderer.localClippingEnabled=true;
const corte=new THREE.Plane(new THREE.Vector3(-1,0,0),0);const mats=[];
function camada(cor,tam,op,raio){const m=new THREE.PointsMaterial({color:cor,size:tam,sizeAttenuation:false,transparent:true,opacity:op,depthWrite:false,clippingPlanes:[corte]});mats.push(m);const p=new THREE.Points(geo,m);p.scale.setScalar(raio);scene.add(p);return p}
// campo harmônico dourado (irrevogável: raio e cor fixos)
const ouro=camada(0xe8c36a,1.7,.95,1.0);
// membrana dual
const R_FORA=.93,R_DENTRO=.88;
const azul=camada(0x4f8cff,1.6,.8,R_FORA), verm=camada(0xe0424f,1.6,.8,R_DENTRO);
// membranas intermediárias: as seis camadas do organograma (provisórias)
const CAM=[['IA · Técnica',0x9bd46a,.78],['Matemática',0x4fd1c5,.68],['Geometria',0x5aa9ff,.58],['Estética',0xb48cff,.48],['Ética',0xe0607e,.38],['Filosofia',0xe8c36a,.28]];
const inter=CAM.map(c=>camada(c[1],1.1,.28,c[2]));
// α no centro
const centro=new THREE.Mesh(new THREE.SphereGeometry(.03,16,12),new THREE.MeshBasicMaterial({color:0xffffff}));scene.add(centro);
let positivo=true,auto=false,tAuto=0;
function alvo(){return positivo?{az:R_FORA,vm:R_DENTRO}:{az:R_DENTRO,vm:R_FORA}}
function texto(){document.getElementById('estadoTxt').innerHTML=positivo
 ?'Membrana <b style="color:#a9c8ff">azul</b> por fora.'
 :'Membrana <b style="color:#ff9aa2">vermelha</b> por fora.'}
function set(pos){positivo=pos;document.getElementById('bPos').setAttribute('aria-pressed',pos);document.getElementById('bNeg').setAttribute('aria-pressed',!pos);texto()}
document.getElementById('bPos').onclick=()=>{auto=false;document.getElementById('bAuto').setAttribute('aria-pressed',false);set(true)};
document.getElementById('bNeg').onclick=()=>{auto=false;document.getElementById('bAuto').setAttribute('aria-pressed',false);set(false)};
document.getElementById('bAuto').onclick=()=>{auto=!auto;document.getElementById('bAuto').setAttribute('aria-pressed',auto);tAuto=0};
function toggle(id,fn){const b=document.getElementById(id);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);fn(v)}}
toggle('vOuro',v=>ouro.visible=v);toggle('vMemb',v=>{azul.visible=verm.visible=v});toggle('vInter',v=>inter.forEach(p=>p.visible=v));toggle('vCentro',v=>centro.visible=v);toggle('vCorte',v=>{mats.forEach(m=>{m.clippingPlanes=v?[corte]:[];m.needsUpdate=true})});
function tam(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.position.setLength(w<600?4.4:3.4);camera.updateProjectionMatrix()}
addEventListener('resize',tam);tam();texto();
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();
  if(auto){tAuto+=dt;if(tAuto>3.5){tAuto=0;set(!positivo)}}
  const a=alvo(),k=reduz?1:Math.min(1,dt*3.2);
  azul.scale.setScalar(azul.scale.x+(a.az-azul.scale.x)*k);verm.scale.setScalar(verm.scale.x+(a.vm-verm.scale.x)*k);
  controls.update();renderer.render(scene,camera)})();
window.__esf={NP,G,ouro,azul,verm,inter,set};
</script>
</body>
</html>
