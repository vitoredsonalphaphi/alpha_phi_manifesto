<style>
/* Layout: as seis fases da cascata como cascas aninhadas, do centro (o beep) para fora (o quinto passo); barra compacta no alto, legenda embaixo. Visual único, escuro. */
:root{--bg:#090c14;--panel:rgba(14,18,30,.94);--line:#262c40;--fg:#e7e9f2;--muted:#9aa1b8;--gold:#e8c36a;
 --f-disp:"Cinzel",Georgia,serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;margin:0;overflow:hidden}
#cena{position:fixed;inset:0;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:6px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--bg) 75%,transparent)}
h1{font:600 14px var(--f-disp);letter-spacing:.08em;color:var(--gold);margin:0 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(14,18,30,.85);color:var(--fg);border-radius:999px;padding:5px 10px;font:500 12px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.linha{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.linha input{flex:1;accent-color:var(--gold)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);max-height:34%;overflow-y:auto;
 padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;line-height:1.45;color:#cfd3e2}
footer b{color:var(--fg)}
</style>
